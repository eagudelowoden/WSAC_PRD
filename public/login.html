<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAC - Iniciar sesión</title>
    <link rel="icon" type="image/png" href="imagenes/doc.png" />
    <link rel="stylesheet" href="css/design-system.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"
        integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.22.2/dist/sweetalert2.all.min.js"
        integrity="sha384-kR2tS24oEqwHzfBnAN4yxA8ib4vGEOMaANrncAlq8i0lsgvGoOzSPXFbj5dHYUZK"
        crossorigin="anonymous"></script>
    <script src="js/actualizacion-check.js"></script>
    <script src="js/app-version.js"></script>

    <style>
        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {

            --blue: #102E4A;
            --blue-hover: #0B263E;
            --orange: #FF5400;

            --text: #10233A;
            --text-secondary: #64748B;
            --placeholder: #9AAABD;

            --background: #F7FAFD;
            --white: #FFFFFF;

            --border: #D7E0EA;
            --border-light: #E5EBF2;

            --shadow: 0 14px 35px rgba(16, 46, 74, 0.09);
        }

        /* =====================================================
           RESET
        ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            background: var(--background);
        }

        button,
        input {
            font: inherit;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .top-header {
            width: 100%;
            height: 64px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid #E2E8F0;
            position: relative;
            z-index: 10;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            width: auto;
            white-space: nowrap;
            color: var(--blue);
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.55px;
            line-height: 1;
        }

        .brand span {
            color: var(--orange);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-action {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #31465D;
            text-decoration: none;
            font-size: 12px;
            white-space: nowrap;
            transition: color .2s ease;
        }

        .header-action:hover {
            color: var(--blue);
        }

        .header-action svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* =====================================================
           ÁREA PRINCIPAL
        ===================================================== */

        .main {
            position: relative;
            width: 100%;
            min-height: calc(100vh - 64px);
            min-height: calc(100dvh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px 55px;
            overflow: hidden;
        }

        /* =====================================================
           FONDO DECORATIVO
        ===================================================== */

        .background {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background:
                linear-gradient(120deg, transparent 0%, transparent 38%, rgba(16, 46, 74, 0.035) 38.1%, rgba(16, 46, 74, 0.035) 38.2%, transparent 38.3%),
                linear-gradient(58deg, transparent 0%, transparent 55%, rgba(16, 46, 74, 0.028) 55.1%, rgba(16, 46, 74, 0.028) 55.2%, transparent 55.3%),
                linear-gradient(145deg, transparent 0%, transparent 72%, rgba(16, 46, 74, 0.025) 72.1%, rgba(16, 46, 74, 0.025) 72.2%, transparent 72.3%);
        }

        .background::before {
            content: "";
            position: absolute;
            width: 620px;
            height: 620px;
            top: -390px;
            left: -180px;
            border-radius: 50%;
            border: 1px solid rgba(16, 46, 74, 0.035);
            box-shadow: 0 0 0 90px rgba(16, 46, 74, 0.012), 0 0 0 180px rgba(16, 46, 74, 0.008);
        }

        .background::after {
            content: "";
            position: absolute;
            width: 720px;
            height: 720px;
            right: -470px;
            bottom: -510px;
            border-radius: 50%;
            border: 1px solid rgba(16, 46, 74, 0.035);
            box-shadow: 0 0 0 100px rgba(16, 46, 74, 0.012), 0 0 0 200px rgba(16, 46, 74, 0.008);
        }

        .soft-shape {
            position: absolute;
            width: 900px;
            height: 1px;
            left: -180px;
            top: 38%;
            background: linear-gradient(90deg, transparent, rgba(16, 46, 74, 0.045), transparent);
            transform: rotate(-25deg);
        }

        .soft-shape::after {
            content: "";
            position: absolute;
            width: 900px;
            height: 1px;
            left: 300px;
            top: 180px;
            background: linear-gradient(90deg, transparent, rgba(16, 46, 74, 0.035), transparent);
            transform: rotate(18deg);
        }

        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 34px;
            box-shadow: var(--shadow);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon {
            width: 46px;
            height: 46px;
            margin: 0 auto 15px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #EEF4FB;
            color: var(--blue);
        }

        .login-icon svg {
            width: 23px;
            height: 23px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-title {
            margin: 0;
            color: var(--text);
            font-size: 25px;
            line-height: 1.2;
            font-weight: 750;
            letter-spacing: -0.8px;
        }

        .login-subtitle {
            margin: 7px 0 0;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        /* =====================================================
           FORMULARIO
        ===================================================== */

        .form-group {
            margin-bottom: 17px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            color: #31445A;
            font-size: 12px;
            font-weight: 650;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 17px;
            height: 17px;
            color: #8AA0B7;
            pointer-events: none;
            transition: color .2s ease;
        }

        .input-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .form-input {
            width: 100%;
            height: 47px;
            padding: 0 42px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: #FCFDFE;
            color: var(--text);
            font-size: 13px;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .form-input::placeholder {
            color: var(--placeholder);
        }

        .form-input:hover {
            border-color: #C5D1DE;
        }

        .form-input:focus {
            background: #FFFFFF;
            border-color: #8CA8C7;
            box-shadow: 0 0 0 3px rgba(16, 46, 74, .07);
        }

        .form-input:focus~.input-icon {
            color: var(--blue);
        }

        .form-input:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* =====================================================
           MOSTRAR CONTRASEÑA
        ===================================================== */

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            padding: 0;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #8AA0B7;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .password-toggle:hover {
            color: var(--blue);
            background: #EEF4FB;
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =====================================================
           OPCIONES
        ===================================================== */

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 2px 0 20px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
        }

        .remember input {
            width: 14px;
            height: 14px;
            margin: 0;
            accent-color: var(--blue);
            cursor: pointer;
        }

        .forgot {
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--blue);
            font-size: 11px;
            font-weight: 650;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* =====================================================
           MENSAJE DE ERROR
        ===================================================== */

        .login-error {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: -2px 0 17px;
            padding: 10px 12px;
            border-radius: 9px;
            background: #FFF3EC;
            border: 1px solid #FFD5BA;
            color: #C24A00;
            font-size: 12px;
            line-height: 1.4;
        }

        .login-error svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =====================================================
           BOTÓN LOGIN
        ===================================================== */

        .login-button {
            width: 100%;
            height: 47px;
            border: 0;
            border-radius: 10px;
            background: var(--blue);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(16, 46, 74, .17);
            transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
        }

        .login-button:hover:not(:disabled) {
            background: var(--blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(16, 46, 74, .21);
        }

        .login-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-button:disabled {
            background: #7C8DA0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .login-button svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .button-spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, .4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .65s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .separator {
            width: 100%;
            height: 1px;
            margin: 23px 0 17px;
            background: #E7ECF2;
        }

        .footer {
            text-align: center;
            color: #8998AA;
            font-size: 10px;
            line-height: 1.5;
        }

        .footer strong {
            color: #708298;
        }

        .secure {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 9px;
            color: #8D9BAA;
            font-size: 9px;
        }

        .secure-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #42A66E;
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 700px) {
            .top-header {
                padding: 0 18px;
            }

            .main {
                padding: 40px 18px;
            }
        }

        /* =====================================================
           MÓVIL
        ===================================================== */

        @media (max-width: 480px) {
            .top-header {
                height: 58px;
                padding: 0 16px;
            }

            .brand {
                font-size: 16px;
            }

            .header-actions {
                gap: 14px;
            }

            .header-action {
                gap: 5px;
                font-size: 11px;
            }

            .header-action svg {
                width: 16px;
                height: 16px;
            }

            .main {
                min-height: calc(100dvh - 58px);
                padding: 30px 14px 35px;
            }

            .login-card {
                width: 100%;
                max-width: 400px;
                padding: 27px 21px;
                border-radius: 15px;
            }

            .login-title {
                font-size: 22px;
            }

            .login-subtitle {
                font-size: 12px;
            }

            .background {
                opacity: .65;
            }
        }

        /* =====================================================
           MÓVIL PEQUEÑO
        ===================================================== */

        @media (max-width: 360px) {
            .top-header {
                padding: 0 12px;
            }

            .header-actions {
                gap: 10px;
            }

            .header-action span {
                display: none;
            }

            .main {
                padding: 22px 10px 28px;
            }

            .login-card {
                padding: 24px 17px;
            }

            .login-icon {
                width: 42px;
                height: 42px;
                margin-bottom: 13px;
            }

            .login-title {
                font-size: 21px;
            }

            .form-options {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .forgot {
                align-self: flex-end;
            }
        }

        /* =====================================================
           POCA ALTURA
        ===================================================== */

        @media (max-height: 650px) {
            .main {
                align-items: flex-start;
                padding-top: 25px;
                padding-bottom: 25px;
            }

            .login-card {
                padding-top: 23px;
                padding-bottom: 23px;
            }

            .login-icon {
                display: none;
            }

            .login-header {
                margin-bottom: 19px;
            }

            .form-group {
                margin-bottom: 13px;
            }

            .separator {
                margin-top: 17px;
                margin-bottom: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation-duration: .001ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">

        <div class="brand"><span>SAC</span></div>

        <div class="header-actions">




        </div>

    </header>

    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="main" id="app">

        <div class="background">
            <div class="soft-shape"></div>
        </div>

        <section class="login-card" aria-label="Inicio de sesión">

            <div class="login-header">

                <div class="login-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="3.2"></circle>
                        <path d="M5 20 C5.7 16.7 8.1 15 12 15 S18.3 16.7 19 20"></path>
                    </svg>
                </div>

                <h1 class="login-title">Iniciar sesión</h1>
                <p class="login-subtitle">Sistema de Aprobaciones Woden</p>

            </div>

            <form @submit.prevent="iniciarSesion">

                <!-- USUARIO -->
                <div class="form-group">

                    <label class="form-label" for="username">Usuario</label>

                    <div class="input-wrapper">

                        <input id="username" class="form-input" type="text" placeholder="Ingresa tu usuario"
                            autocomplete="username" v-model="usuario" :disabled="loading" required>

                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="8" r="3.5"></circle>
                                <path d="M5 20 C5.7 16.8 8.2 15 12 15 S18.3 16.8 19 20"></path>
                            </svg>
                        </div>

                    </div>

                </div>

                <!-- CONTRASEÑA -->
                <div class="form-group">

                    <label class="form-label" for="password">Contraseña</label>

                    <div class="input-wrapper">

                        <input id="password" class="form-input" :type="showPass ? 'text' : 'password'"
                            placeholder="Ingresa tu contraseña" autocomplete="current-password" v-model="password"
                            :disabled="loading" required>

                        <div class="input-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                                <path d="M8 10 V7 A4 4 0 0 1 16 7 V10"></path>
                            </svg>
                        </div>

                        <button type="button" class="password-toggle"
                            :aria-label="showPass ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                            @click="showPass = !showPass">
                            <svg viewBox="0 0 24 24">
                                <path d="M2.5 12 S6 5.5 12 5.5 S21.5 12 21.5 12 S18 18.5 12 18.5 S2.5 12 2.5 12Z">
                                </path>
                                <circle cx="12" cy="12" r="2.8"></circle>
                            </svg>
                        </button>

                    </div>

                </div>

                <!-- OPCIONES -->
                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox" v-model="recordar">
                        <span>Recordarme</span>
                    </label>

                    <button type="button" class="forgot" @click="olvideContrasena">
                        ¿Olvidaste tu contraseña?
                    </button>

                </div>

                <!-- ERROR -->
                <div v-if="errorMsg" class="login-error">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 8V13"></path>
                        <path d="M12 16.5V16.6"></path>
                    </svg>
                    <span>{{ errorMsg }}</span>
                </div>

                <!-- BOTÓN -->
                <button type="submit" class="login-button" :disabled="loading">
                    <template v-if="loading">
                        <span class="button-spinner"></span>
                        <span>Autenticando...</span>
                    </template>
                    <template v-else>
                        <span>Ingresar</span>
                        <svg viewBox="0 0 24 24">
                            <path d="M5 12H19"></path>
                            <path d="M13 6L19 12L13 18"></path>
                        </svg>
                    </template>
                </button>

                <!-- FOOTER -->
                <div class="separator"></div>

                <div class="footer">
                    <strong>Versión <span data-app-version>2.0.9</span></strong>
                    &nbsp;·&nbsp;
                    © 2026 SAC CLOUD
                </div>

                <div class="secure">
                    <span class="secure-dot"></span>
                    Conexión segura
                </div>

            </form>

        </section>

    </main>

    <!-- =====================================================
         VUE
    ====================================================== -->

    <script>

        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    usuario: "",
                    password: "",
                    recordar: false,
                    loading: false,
                    showPass: false,
                    errorMsg: "",
                };
            },
            mounted() {
                const params = new URLSearchParams(window.location.search);
                const error = params.get("error");
                const MENSAJES_ERROR = {
                    sin_acceso: "Tu usuario no tiene acceso a ningún módulo todavía. Contacta al administrador.",
                    auth_required: "Debes iniciar sesión para continuar.",
                };
                if (error) {
                    this.errorMsg = MENSAJES_ERROR[error] || "No se pudo completar el acceso. Intenta de nuevo.";
                    // Limpia el parámetro de la URL para que no reaparezca al recargar.
                    params.delete("error");
                    const query = params.toString();
                    window.history.replaceState({}, "", window.location.pathname + (query ? `?${query}` : ""));
                }
            },
            methods: {
                async iniciarSesion() {
                    this.errorMsg = "";

                    if (!this.usuario.trim() || !this.password) {
                        this.errorMsg = "Completa usuario y contraseña.";
                        return;
                    }

                    this.loading = true;

                    const Toast = Swal.mixin({
                        toast: true,
                        position: "top-end",
                        showConfirmButton: false,
                        timer: 2000,
                        timerProgressBar: true,
                    });

                    try {
                        const res = await fetch("/api/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            credentials: "same-origin",
                            body: JSON.stringify({
                                usuario: this.usuario,
                                password: this.password,
                            }),
                        });
                        const data = await res.json();

                        if (data.status === "ok") {
                            await Toast.fire({ icon: "success", title: "Acceso correcto" });
                            window.location.href = data.redirect;
                        } else {
                            this.errorMsg = data.message || "Credenciales inválidas";
                        }
                    } catch (e) {
                        this.errorMsg = "Error de conexión. Intenta de nuevo.";
                    } finally {
                        this.loading = false;
                    }
                },

                olvideContrasena() {
                    Swal.fire({
                        icon: "info",
                        title: "Recuperar contraseña",
                        text: "Contacta al administrador del sistema para restablecer tu contraseña.",
                        confirmButtonColor: "#102E4A",
                    });
                },
            },
        }).mount("#app");

    </script>

</body>

</html>
