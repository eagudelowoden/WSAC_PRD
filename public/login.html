<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSAC</title>
    <link rel="icon" type="image/png" href="imagenes/doc.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/actualizacion-check.js"></script>

    <style>
      /* --- CONFIGURACIÓN DE COLORES PREMIUM (MODO CLARO + AZUL POTENTE) --- */
      :root {
        --bank-light-bg: #f4f7fc;
        --bank-card-glass: rgba(255, 255, 255, 0.92);
        --bank-border: rgba(0, 47, 153, 0.08);
        --text-main: #0c111d;
        --text-muted: #475467;
        --bank-blue-intense: #002f99; /* Azul WSAC con máxima potencia y profundidad */
        --bank-blue-hover: #001f66; /* Variación para hover */
      }

      body {
        background-color: var(--bank-light-bg);
        /* FONDO DE ONDAS FLUIDAS */
        background-image:
          radial-gradient(
            ellipse 70% 40% at 30% -10%,
            rgba(219, 230, 255, 0.85) 0%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 60% 50% at 80% 110%,
            rgba(210, 226, 255, 0.7) 0%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 50% 30% at 100% 20%,
            rgba(228, 237, 255, 0.9) 0%,
            transparent 100%
          ),
          radial-gradient(
            ellipse 80% 40% at 0% 80%,
            rgba(235, 242, 255, 0.95) 0%,
            transparent 100%
          );

        font-family:
          "Amazon Ember", "Open Sans", "Helvetica Neue", Roboto, Arial,
          sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        overflow-x: hidden;
      }

      .login-wrapper {
        width: 100%;
        max-width: 410px;
        padding: 20px;
      }

      /* TARJETA DE LOGIN CON TAMAÑO AMPLIO ORIGINAL Y SOMBRA DE CABECERA DE AWS */
      .login-card {
        background: var(--bank-card-glass);
        border: 1px solid var(--bank-border);
        border-radius: 12px;
        padding: 3rem 2.25rem;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        position: relative;

        box-shadow:
          0 30px 60px -15px rgba(0, 47, 153, 0.07),
          0 15px 30px -10px rgba(165, 198, 255, 0.12),
          0 0 1px 1px rgba(0, 47, 153, 0.02);

        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .login-card:hover {
        border-color: rgba(0, 47, 153, 0.2);
        box-shadow:
          0 40px 70px -15px rgba(0, 47, 153, 0.1),
          0 20px 35px -10px rgba(165, 198, 255, 0.18);
      }

      /* Icono de nube en la esquina superior derecha */
      .card-cloud-badge {
        position: absolute;
        top: 20px;
        right: 22px;
        color: var(--bank-blue-intense);
        opacity: 0.65;
        font-size: 1.35rem;
        transition: opacity 0.2s ease;
      }

      .login-card:hover .card-cloud-badge {
        opacity: 1;
      }

      .brand-name {
        font-size: 2.1rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        margin-bottom: 0.35rem;
        color: var(--bank-blue-intense);
      }

      .subtitle {
        font-size: 0.85rem;
        font-weight: 400;
        color: var(--text-muted);
        letter-spacing: 0.01em;
        margin-bottom: 2.5rem;
      }

      /* --- ESTRUCTURA DE CAMPOS COMPACTOS --- */
      .form-group-custom {
        position: relative;
        margin-bottom: 1.25rem;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      /* Iconos modernos de líneas finas estilo Fintech */
      .input-wrapper i.input-icon {
        position: absolute;
        left: 14px;
        color: var(--text-muted);
        font-size: 1.1rem;
        transition: color 0.2s ease;
        z-index: 4;
        pointer-events: none;
      }

      /* Inputs compactos */
      .form-control-custom {
        width: 100%;
        background: rgba(248, 250, 252, 0.8);
        border: 1px solid rgba(0, 47, 153, 0.12);
        border-radius: 6px;
        padding: 10px 14px 10px 40px;
        color: var(--text-main);
        font-size: 0.9rem;
        font-weight: 500;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Efectos interactivos de enfoque */
      .form-control-custom:focus {
        outline: none;
        border-color: var(--bank-blue-intense);
        box-shadow: 0 0 0 3px rgba(0, 47, 153, 0.07);
        background: #ffffff;
      }

      .form-control-custom:focus + i.input-icon,
      .form-control-custom:focus ~ i.input-icon {
        color: var(--bank-blue-intense);
      }

      /* Botón Mostrar/Ocultar Contraseña */
      .btn-show-pass {
        position: absolute;
        right: 14px;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 2px;
        font-size: 1rem;
        transition:
          color 0.2s,
          transform 0.2s;
        z-index: 4;
      }
      .btn-show-pass:hover {
        color: var(--bank-blue-intense);
        transform: scale(1.05);
      }

      /* Botón Sólido con alineación para icono interno */
      .btn-submit-premium {
        background: var(--bank-blue-intense);
        color: #ffffff;
        border: 1px solid var(--bank-blue-intense);
        border-radius: 6px;
        padding: 10px 14px;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        width: 100%;
        margin-top: 0.25rem;
        box-shadow: 0 4px 10px rgba(0, 47, 153, 0.12);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px; /* Espacio entre texto e icono */
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-submit-premium i.btn-icon {
        font-size: 1.2rem;
        transition: transform 0.2s ease;
        line-height: 1;
      }

      .btn-submit-premium:hover:not(:disabled) {
        background: var(--bank-blue-hover);
        border-color: var(--bank-blue-hover);
        transform: translateY(-1px);
        box-shadow: 0 5px 14px rgba(0, 47, 153, 0.22);
      }

      /* Efecto dinámico en el icono del botón al hacer hover */
      .btn-submit-premium:hover:not(:disabled) i.btn-icon {
        transform: translateX(2px);
      }

      .btn-submit-premium:active:not(:disabled) {
        transform: translateY(0);
      }

      .btn-submit-premium:disabled {
        background: #e2e8f0;
        border-color: transparent;
        color: #94a3b8;
        cursor: not-allowed;
        box-shadow: none;
      }

      .footer-text {
        color: var(--text-muted);
        font-size: 0.68rem;
        letter-spacing: 0.03em;
        font-weight: 500;
      }
    </style>
  </head>

  <body>
    <div id="app" class="login-wrapper">
      <div class="login-card">
        <div class="card-cloud-badge">
          <i class="bi bi-cloud-fill"></i>
        </div>

        <div class="text-center">
          <h1 class="brand-name">Bienvenido a SAC</h1>
          <p class="subtitle">Sistema de Aprobaciones Woden</p>
        </div>

        <form @submit.prevent="iniciarSesion">
          <div class="form-group-custom">
            <div class="input-wrapper">
              <input
                type="text"
                class="form-control-custom"
                id="u"
                placeholder="Usuario de red"
                v-model="usuario"
                required
              />
              <i class="bi bi-person-vcard input-icon"></i>
            </div>
          </div>

          <div class="form-group-custom">
            <div class="input-wrapper">
              <input
                :type="showPass ? 'text' : 'password'"
                class="form-control-custom"
                id="p"
                placeholder="Contraseña de red"
                v-model="password"
                required
              />
              <i class="bi bi-shield-lock input-icon"></i>
              <button
                type="button"
                class="btn-show-pass"
                @click="showPass = !showPass"
              >
                <i :class="showPass ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit-premium" :disabled="loading">
            <template v-if="loading">
              <span
                class="spinner-border spinner-border-sm me-2"
                style="width: 0.85rem; height: 0.85rem"
              ></span>
              AUTENTICANDO...
            </template>
            <template v-else>
              Ingresar <i class="bi bi-arrow-right-short btn-icon"></i>
            </template>
          </button>

          <div class="text-center mt-4">
            <hr
              class="my-4 opacity-25"
              style="border-color: rgba(0, 47, 153, 0.15)"
            />
            <div class="footer-text">Versión 2.0.8 • © 2026 WSAC CLOUD</div>
          </div>
        </form>
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            usuario: "",
            password: "",
            loading: false,
            showPass: false,
          };
        },
        methods: {
          async iniciarSesion() {
            this.loading = true;
            const Toast = Swal.mixin({
              toast: true,
              position: "top-end",
              showConfirmButton: false,
              timer: 2000,
              timerProgressBar: true,
            });

            try {
              const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  usuario: this.usuario,
                  password: this.password,
                }),
              });
              const data = await res.json();

              if (data.status === "ok") {
                await Toast.fire({ icon: "success", title: "Acceso correcto" });
                window.location.href = data.redirect;
              } else {
                Swal.fire({
                  title: "Error",
                  text: "Credenciales inválidas",
                  icon: "error",
                  confirmButtonColor: "#002f99",
                  background: "#ffffff",
                  color: "#0c111d",
                });
              }
            } catch (e) {
              Toast.fire({ icon: "error", title: "Error de conexión" });
            } finally {
              this.loading = false;
            }
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
