<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSAC | Sistema de Aprobaciones</title>
    <link rel="icon" type="image/png" href="imagenes/doc.png" />
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/loginv2.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      integrity="sha384-4LISF5TTJX/fLmGSxO53rV4miRxdg84mZsxmO8Rx5jGtp/LbrixFETvWa5a6sESd"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"
      integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/sweetalert2@11.22.2/dist/sweetalert2.all.min.js"
      integrity="sha384-kR2tS24oEqwHzfBnAN4yxA8ib4vGEOMaANrncAlq8i0lsgvGoOzSPXFbj5dHYUZK"
      crossorigin="anonymous"
    ></script>
    <script src="js/actualizacion-check.js"></script>
    <script src="js/app-version.js"></script>
  </head>

  <body>
    <div id="app" class="login-wrapper">
      <div class="login-card">
        <div class="card-cloud-badge">
          <i class="bi bi-cloud-fill"></i>
        </div>

        <div class="text-center">
          <h1 class="brand-name">Bienvenido a SAC</h1>
          <p class="subtitle">Sistema de Aprobaciones Woden</p>
        </div>

        <form @submit.prevent="iniciarSesion">
          <div class="form-group-custom">
            <label for="u" class="field-label">Usuario</label>
            <div class="input-wrapper">
              <input
                type="text"
                class="form-control-custom"
                id="u"
                placeholder="user"
                v-model="usuario"
                required
              />
              <i class="bi bi-person input-icon"></i>
            </div>
          </div>

          <div class="form-group-custom">
            <label for="p" class="field-label">Contraseña</label>
            <div class="input-wrapper">
              <input
                :type="showPass ? 'text' : 'password'"
                class="form-control-custom"
                id="p"
                placeholder="password"
                v-model="password"
                required
              />
              <i class="bi bi-shield-lock input-icon"></i>
              <button
                type="button"
                class="btn-show-pass"
                @click="showPass = !showPass"
              >
                <i :class="showPass ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
              </button>
            </div>
          </div>

          <div v-if="errorMsg" class="login-error">
            <i class="bi bi-exclamation-circle-fill"></i> {{ errorMsg }}
          </div>

          <button type="submit" class="btn-submit-premium" :disabled="loading">
            <template v-if="loading">
              <span
                class="spinner-border spinner-border-sm me-2"
                style="width: 0.85rem; height: 0.85rem"
              ></span>
              AUTENTICANDO...
            </template>
            <template v-else>
              Ingresar <i class="bi bi-arrow-right-short btn-icon"></i>
            </template>
          </button>

          <div class="text-center mt-4">
            <hr
              class="my-4 opacity-25"
              style="border-color: rgba(0, 47, 153, 0.15)"
            />
            <div class="footer-text">Versión <span data-app-version>2.0.9</span> • © 2026 SAC CLOUD</div>
          </div>
        </form>
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            usuario: "",
            password: "",
            loading: false,
            showPass: false,
            errorMsg: "",
          };
        },
        methods: {
          async iniciarSesion() {
            this.errorMsg = "";
            if (!this.usuario.trim() || !this.password) {
              this.errorMsg = "Completa usuario y contraseña.";
              return;
            }
            this.loading = true;
            const Toast = Swal.mixin({
              toast: true,
              position: "top-end",
              showConfirmButton: false,
              timer: 2000,
              timerProgressBar: true,
            });

            try {
              const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify({
                  usuario: this.usuario,
                  password: this.password,
                }),
              });
              const data = await res.json();

              if (data.status === "ok") {
                await Toast.fire({ icon: "success", title: "Acceso correcto" });
                window.location.href = data.redirect;
              } else {
                this.errorMsg = data.message || "Credenciales inválidas";
              }
            } catch (e) {
              this.errorMsg = "Error de conexión. Intenta de nuevo.";
            } finally {
              this.loading = false;
            }
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
