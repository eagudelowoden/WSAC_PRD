<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSAC | Sistema de Aprobaciones</title>
    <link rel="icon" type="image/png" href="imagenes/doc.png" />
    <link rel="stylesheet" href="css/loginv2.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/actualizacion-check.js"></script>
  </head>

  <body>
    <div id="app" class="login-wrapper">
      <div class="login-card">
        <div class="text-center">
          <h1 class="brand-name">WSAC</h1>
          <p class="subtitle">Sistema de Aprobaciones Woden</p>
        </div>

        <form @submit.prevent="iniciarSesion">
          <div class="form-group-custom">
            <label for="u">Usuario</label>
            <div class="input-wrapper">
              <i class="bi bi-person input-icon"></i>
              <input
                type="text"
                class="form-control-custom"
                id="u"
                placeholder="User"
                v-model="usuario"
                required
              />
            </div>
          </div>

          <div class="form-group-custom">
            <label for="p">Contraseña</label>
            <div class="input-wrapper">
              <i class="bi bi-key input-icon"></i>
              <input
                :type="showPass ? 'text' : 'password'"
                class="form-control-custom"
                id="p"
                placeholder="Password"
                v-model="password"
                required
              />
              <button
                type="button"
                class="btn-show-pass"
                @click="showPass = !showPass"
              >
                <i :class="showPass ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit-premium" :disabled="loading">
            <template v-if="loading">
              <span
                class="spinner-border spinner-border-sm me-2"
                style="width: 1rem; height: 1rem"
              ></span>
              AUTENTICANDO...
            </template>
            <template v-else>Ingresar</template>
          </button>

          <div class="text-center mt-4">
            <hr
              class="my-4 opacity-25"
              style="border-color: rgba(0, 47, 153, 0.15)"
            />
            <div class="footer-text">Versión 2.0.8 • © 2026 WSAC CLOUD</div>
          </div>
        </form>
      </div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            usuario: "",
            password: "",
            loading: false,
            showPass: false,
          };
        },
        methods: {
          async iniciarSesion() {
            this.loading = true;
            const Toast = Swal.mixin({
              toast: true,
              position: "top-end",
              showConfirmButton: false,
              timer: 2000,
              timerProgressBar: true,
            });

            try {
              const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  usuario: this.usuario,
                  password: this.password,
                }),
              });
              const data = await res.json();

              if (data.status === "ok") {
                await Toast.fire({ icon: "success", title: "Acceso correcto" });
                window.location.href = data.redirect;
              } else {
                Swal.fire({
                  title: "Error",
                  text: "Credenciales inválidas",
                  icon: "error",
                  confirmButtonColor: "#002f99",
                  background: "#ffffff",
                  color: "#0c111d",
                });
              }
            } catch (e) {
              Toast.fire({ icon: "error", title: "Error de conexión" });
            } finally {
              this.loading = false;
            }
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
