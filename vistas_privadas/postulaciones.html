<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSAC - Postulaciones</title>
    <link rel="icon" type="image/png" href="imagenes/doc.png" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="css/postulaciones.css" />
    <link rel="stylesheet" href="css/aprobUno.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        document.write('<script src="/js/actualizacion-check.js?v=' + Date.now() + '"><\/script>');
    </script>
</head>

<body style="overflow: hidden;">
    <div id="app" class="d-flex flex-column vh-100">

        <nav class="navbar navbar-custom px-3 py-1 shadow-sm justify-content-between"
            style="flex-shrink: 0; min-height: 40px;">
            <div class="d-flex align-items-center gap-4">
                <span class="navbar-brand mb-0 d-flex align-items-center gap-2">
                    <i class="bi bi-building-gear fs-6"></i>
                    <span class="small-brand">Gestión Área de Selección</span>
                </span>

                <div class="nav-modules d-flex gap-2 border-start ps-3"
                    style="border-color: rgba(255,255,255,0.2) !important;">
                    <a href="/panel-administrativo" class="text-decoration-none">
                        <button class="btn-module" :class="{ 'active': !esModuloPostulaciones }">
                            <i class="bi bi-people me-1"></i>
                            <span class="d-none d-lg-inline">Colaboradores</span>
                        </button>
                    </a>

                    <a href="/postulaciones" class="text-decoration-none">
                        <button class="btn-module" :class="{ 'active': esModuloPostulaciones }">
                            <i class="bi bi-file-earmark-text me-1"></i>
                            <span class="d-none d-lg-inline">Postulaciones</span>
                        </button>
                    </a>

                    <button class="btn-module">
                        <i class="bi bi-calendar-event me-1"></i>
                        <span class="d-none d-lg-inline">Agendamiento</span>
                    </button>
                </div>
            </div>

            <div class="d-flex align-items-center">
                <div class="dropdown">
                    <button
                        class="btn btn-link text-white text-decoration-none d-flex align-items-center gap-2 user-dropdown-btn py-0"
                        type="button" @click="menuAbierto = !menuAbierto">
                        <div class="avatar-circle-sm">
                            {{ usuarioSys?.nombre?.charAt(0).toUpperCase() || '?' }}
                        </div>
                        <span class="extra-small d-none d-md-inline" v-if="usuarioSys?.nombre">
                            {{ usuarioSys.nombre }}
                        </span>
                        <i class="bi bi-chevron-down x-small"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-1" :class="{ 'show': menuAbierto }"
                        style="position: absolute; right: 0; font-size: 0.8rem;">
                        <li><button class="dropdown-item text-danger d-flex align-items-center gap-2"
                                @click="cerrarSesion"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="main-container flex-grow-1 d-flex overflow-hidden">

            <div class="sidebar-postulaciones shadow-sm p-3 bg-white">
                <h6 class="fw-bold mb-3"><i class="bi bi-filter-left"></i> Filtros</h6>
                <div class="filter-group mb-4">
                    <label class="form-label small fw-bold text-muted">Estado del Proceso</label>
                    <div class="form-check" v-for="estado in ['Entrevista', 'Pruebas Técnicas', 'Seleccionado']">
                        <input class="form-check-input" type="checkbox" :id="estado">
                        <label class="form-check-label small" :for="estado">{{ estado }}</label>
                    </div>
                </div>
                <div class="filter-group">
                    <label class="form-label small fw-bold text-muted">Fecha</label>
                    <select class="form-select form-select-sm border-0 bg-light">
                        <option>Hoy</option>
                        <option>Última semana</option>
                        <option>Último mes</option>
                    </select>
                </div>
            </div>

            <div class="content-postulaciones p-4 flex-grow-1 overflow-auto">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h3 class="fw-bold m-0">Gestión de Postulaciones</h3>
                        <p class="text-muted small">Visualiza y gestiona los candidatos de las vacantes activas.</p>
                    </div>
                    <button class="btn btn-primary btn-sm rounded-pill px-3"><i class="bi bi-plus-lg"></i> Nueva
                        Vacante</button>
                </div>

                <div class="search-bar-postulaciones mb-4">
                    <div class="input-group shadow-sm rounded overflow-hidden">
                        <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-0" v-model="busqueda"
                            placeholder="Buscar por nombre, cargo o cédula...">
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6 col-lg-4 col-xl-3" v-for="i in 4" :key="i">
                        <div class="card-postulado shadow-sm border-0">
                            <div class="status-indicator bg-warning"></div>
                            <div class="p-3">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <div class="avatar-mini">EA</div>
                                    <div>
                                        <h6 class="m-0 fw-bold small">Candidato #{{i}}</h6>
                                        <span class="badge-cargo">Desarrollador</span>
                                    </div>
                                </div>
                                <div class="info-meta small text-muted mb-3">
                                    <div><i class="bi bi-geo-alt"></i> Medellín, ANT</div>
                                    <div><i class="bi bi-calendar3"></i> Hace {{i}} días</div>
                                </div>
                                <div class="d-grid">
                                    <button class="btn btn-outline-primary btn-sm">Ver Perfil</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    esModuloPostulaciones: true,
                    menuAbierto: false,
                    usuarioSys: JSON.parse(localStorage.getItem('usuario')) || { nombre: 'Elder Agudelo' },
                    busqueda: ''
                }
            },
            methods: {
                async cerrarSesion() {
                    await fetch("/api/logout", { method: "POST", credentials: "same-origin" }).catch(() => {});
                    localStorage.removeItem('usuario');
                    window.location.href = '/login.html';
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
