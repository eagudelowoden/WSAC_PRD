<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WSAC - Agendamiento</title>
  <link rel="icon" type="image/png" href="imagenes/doc.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="stylesheet" href="css/aprobUno.css" />
  <link rel="stylesheet" href="css/postulaciones.css" /> <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>

<body style="overflow: hidden;">
  <div id="app" class="d-flex flex-column vh-100">
    
    <nav class="navbar navbar-custom px-3 py-1 shadow-sm justify-content-between" style="flex-shrink: 0; min-height: 40px;">
      <div class="d-flex align-items-center gap-4">
        <span class="navbar-brand mb-0 d-flex align-items-center gap-2">
          <i class="bi bi-building-gear fs-6"></i>
          <span class="small-brand">Gestión Área de Selección</span>
        </span>

        <div class="nav-modules d-flex gap-2 border-start ps-3" style="border-color: rgba(255,255,255,0.2) !important;">
          <a href="/panel-administrativo" class="text-decoration-none">
            <button class="btn-module">
              <i class="bi bi-people me-1"></i> Colaboradores
            </button>
          </a>

          <a href="/postulaciones" class="text-decoration-none">
            <button class="btn-module">
              <i class="bi bi-file-earmark-text me-1"></i> Postulaciones
            </button>
          </a>

          <a href="/agendamiento" class="text-decoration-none">
            <button class="btn-module active">
              <i class="bi bi-calendar-event me-1"></i> Agendamiento
            </button>
          </a>
        </div>
      </div>

      <div class="d-flex align-items-center">
        <div class="dropdown">
          <button class="btn btn-link text-white text-decoration-none d-flex align-items-center gap-2 user-dropdown-btn py-0" 
                  type="button" @click="menuAbierto = !menuAbierto">
            <div class="avatar-circle-sm">{{ usuarioSys?.nombre?.charAt(0).toUpperCase() || '?' }}</div>
            <span class="extra-small d-none d-md-inline" v-if="usuarioSys?.nombre">{{ usuarioSys.nombre }}</span>
            <i class="bi bi-chevron-down x-small"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-1" :class="{ 'show': menuAbierto }">
            <li><button class="dropdown-item text-danger d-flex align-items-center gap-2" @click="cerrarSesion"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-container flex-grow-1 d-flex overflow-hidden">
      
      <div class="sidebar-postulaciones shadow-sm p-3 bg-white">
        <h6 class="fw-bold mb-3"><i class="bi bi-calendar-check"></i> Próximas Citas</h6>
        
        <div class="list-group list-group-flush">
          <div class="list-group-item px-0 py-2 border-0">
            <div class="small fw-bold">Entrevista Técnica</div>
            <div class="x-small text-muted">Hoy - 02:00 PM</div>
          </div>
          <div class="list-group-item px-0 py-2 border-0">
            <div class="small fw-bold">Prueba Psicotécnica</div>
            <div class="x-small text-muted">Mañana - 09:00 AM</div>
          </div>
        </div>
      </div>

      <div class="content-postulaciones p-4 flex-grow-1 overflow-auto">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold m-0">Calendario de Agendamiento</h3>
          <div class="d-flex gap-2">
             <button class="btn btn-outline-secondary btn-sm rounded-pill px-3">Hoy</button>
             <button class="btn btn-primary btn-sm rounded-pill px-3"><i class="bi bi-calendar-plus"></i> Agendar</button>
          </div>
        </div>

        <div class="card border-0 shadow-sm overflow-hidden">
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
              <thead class="bg-light">
                <tr class="x-small text-uppercase text-muted">
                  <th class="ps-3">Hora</th>
                  <th>Candidato</th>
                  <th>Actividad</th>
                  <th>Responsable</th>
                  <th class="text-end pe-3">Acción</th>
                </tr>
              </thead>
              <tbody class="small">
                <tr v-for="i in 5" :key="i">
                  <td class="ps-3 fw-bold">08:00 AM</td>
                  <td>
                    <div class="d-flex align-items-center gap-2">
                      <div class="avatar-mini x-small" style="width: 25px; height: 25px;">C</div>
                      Candidato #{{i}}
                    </div>
                  </td>
                  <td><span class="badge bg-info-subtle text-info border border-info-subtle">Entrevista Inicial</span></td>
                  <td>Psicólogo RRHH</td>
                  <td class="text-end pe-3">
                    <button class="btn btn-light btn-sm border"><i class="bi bi-pencil"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          menuAbierto: false,
          usuarioSys: JSON.parse(localStorage.getItem('usuario')) || { nombre: 'Elder Agudelo' }
        }
      },
      methods: {
        cerrarSesion() {
          localStorage.removeItem('usuario');
          window.location.href = '/login.html';
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
