<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSAC - Agendamiento</title>
    <link rel="icon" type="image/png" href="imagenes/doc.png" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8/dist/turbo.es2017-umd.min.js"></script>
    <script src="/js/shell-nav.js"></script>
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="css/aprobUno.css" />
    <link rel="stylesheet" href="css/postulaciones.css" />
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js" integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.22.2/dist/sweetalert2.all.min.js" integrity="sha384-kR2tS24oEqwHzfBnAN4yxA8ib4vGEOMaANrncAlq8i0lsgvGoOzSPXFbj5dHYUZK" crossorigin="anonymous"></script>
    <script src="/socket.io/socket.io.js"></script>
  </head>

  <body class="wsac-shell" data-turbo="false">
    <nav id="wsac-topnav" class="navbar navbar-custom wsac-topnav" data-turbo-permanent aria-label="Navegación principal"></nav>
    <div id="app" class="d-flex flex-column">
      <!-- Navbar movido al shell compartido (#wsac-topnav) -->

      <div class="main-container flex-grow-1 d-flex overflow-hidden">
        <div class="sidebar-postulaciones shadow-sm p-3 bg-white">
          <h6 class="fw-bold mb-3">
            <i class="bi bi-calendar-check"></i> Próximas Citas
          </h6>

          <div class="list-group list-group-flush">
            <div class="list-group-item px-0 py-2 border-0">
              <div class="small fw-bold">Entrevista Técnica</div>
              <div class="x-small text-muted">Hoy - 02:00 PM</div>
            </div>
            <div class="list-group-item px-0 py-2 border-0">
              <div class="small fw-bold">Prueba Psicotécnica</div>
              <div class="x-small text-muted">Mañana - 09:00 AM</div>
            </div>
          </div>
        </div>

        <div class="content-postulaciones p-4 flex-grow-1 overflow-auto">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">Calendario de Agendamiento</h3>
            <div class="d-flex gap-2">
              <button
                class="btn btn-outline-secondary btn-sm rounded-pill px-3"
              >
                Hoy
              </button>
              <button class="btn btn-primary btn-sm rounded-pill px-3">
                <i class="bi bi-calendar-plus"></i> Agendar
              </button>
            </div>
          </div>

          <div class="card border-0 shadow-sm overflow-hidden">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead class="bg-light">
                  <tr class="x-small text-uppercase text-muted">
                    <th class="ps-3">Hora</th>
                    <th>Candidato</th>
                    <th>Actividad</th>
                    <th>Responsable</th>
                    <th class="text-end pe-3">Acción</th>
                  </tr>
                </thead>
                <tbody class="small">
                  <tr v-for="i in 5" :key="i">
                    <td class="ps-3 fw-bold">08:00 AM</td>
                    <td>
                      <div class="d-flex align-items-center gap-2">
                        <div
                          class="avatar-mini x-small"
                          style="width: 25px; height: 25px"
                        >
                          C
                        </div>
                        Candidato #{{i}}
                      </div>
                    </td>
                    <td>
                      <span
                        class="badge bg-info-subtle text-info border border-info-subtle"
                        >Entrevista Inicial</span
                      >
                    </td>
                    <td>Psicólogo RRHH</td>
                    <td class="text-end pe-3">
                      <button class="btn btn-light btn-sm border">
                        <i class="bi bi-pencil"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var { createApp } = Vue; // var: con Turbo las vistas comparten contexto JS
      createApp({
        data() {
          return {
            menuAbierto: false,
            usuarioSys: JSON.parse(localStorage.getItem("usuario")) || {
              nombre: "Elder Agudelo",
            },
          };
        },
        methods: {
          async cerrarSesion() {
            await fetch("/api/logout", { method: "POST", credentials: "same-origin" }).catch(() => {});
            localStorage.removeItem("usuario");
            window.location.href = "/login.html";
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
