name: Deploy WSAC Backend

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: 3.133.217.145
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          fingerprint: ""
          script: |
            powershell -Command "Set-Location 'C:\Users\Administrator\Documents\WSAC_PROD'; Write-Host '=== PASO 1:' (Get-Location); git fetch --all; Write-Host '=== PASO 2: reset'; git reset --hard origin/main; Write-Host '=== PASO 3: log'; git log --oneline -3; Write-Host '=== PASO 4: detener pm2 (libera archivos nativos bloqueados en Windows)'; pm2 stop wsac *> $null; Write-Host '=== PASO 5: npm install'; npm install --omit=dev; if ($LASTEXITCODE -ne 0) { Write-Host 'ERROR: npm install fallo'; exit 1 }; Write-Host '=== PASO 6: pm2 start/restart'; pm2 describe wsac *> $null; if ($LASTEXITCODE -eq 0) { pm2 restart wsac --update-env } else { pm2 start server.js --name wsac --update-env }; pm2 save; Write-Host '=== PASO 7: health check'; Start-Sleep -Seconds 5; try { $r = Invoke-WebRequest -Uri 'http://localhost:8081/health' -UseBasicParsing -TimeoutSec 10; if ($r.StatusCode -ne 200) { throw 'status no 200' }; Write-Host '=== DEPLOY COMPLETADO ===' } catch { Write-Host 'ERROR: health check fallo tras el deploy'; exit 1 }"
