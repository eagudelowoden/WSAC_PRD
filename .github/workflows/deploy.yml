name: Deploy WSAC Backend

on:
  push:
    branches: [ main ] # Se activa cuando haces push a main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: 3.133.217.145
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd C:/Users/Administrator/Documents/WSAC_PROD
            
            :: 1. Bajar cambios (forzando para evitar conflictos)
            git fetch --all
            git reset --hard origin/main
            
            :: 2. Instalar dependencias
            npm install --production
            
            :: 3. Reiniciar la app específica
            pm2 restart woden-app --update-env
            
            :: 4. GENERAR TU LOG DE ÉXITO (Formato Windows)
            echo Despliegue exitoso el %DATE% a las %TIME% > success_log.txt