name: Deploy WSAC Backend

on:
  push:
    branches: [ main ] # Se activa cuando haces push a main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: 3.133.217.145
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }} # Esto lo configuraremos ahora
          script: |
            cd C:/Users/Administrator/Documents/WSAC_PROD
            git pull origin main
            npm install
            pm2 reload woden-app