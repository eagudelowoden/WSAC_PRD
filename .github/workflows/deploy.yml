name: Deploy WSAC Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: 3.133.217.145
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          fingerprint: ""
          script: |
            Set-Location "C:\Users\Administrator\Documents\WSAC_PROD"
            Write-Host "=== PASO 1: $(Get-Location) ==="
            Write-Host "=== PASO 2: Git fetch ==="
            git fetch --all
            Write-Host "=== PASO 3: Git reset ==="
            git reset --hard origin/main
            Write-Host "=== PASO 4: Git log ==="
            git log --oneline -3
            Write-Host "=== PASO 5: npm install ==="
            npm install --production
            Write-Host "=== PASO 6: PM2 ==="
            pm2 delete wsac; pm2 start server.js --name wsac --update-env; pm2 save
            Write-Host "=== DEPLOY COMPLETADO ==="
