name: Deploy WSAC Backend

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en AWS vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: 3.133.217.145
          username: Administrator
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          fingerprint: ""
          script: |
            powershell -Command "Set-Location 'C:\Users\Administrator\Documents\WSAC_PROD'; Write-Host '=== PASO 1:' (Get-Location); git fetch --all; Write-Host '=== PASO 2: reset'; git reset --hard origin/main; Write-Host '=== PASO 3: log'; git log --oneline -3; Write-Host '=== PASO 4: detener pm2 (libera archivos nativos bloqueados en Windows)'; pm2 stop WSAC-Backend *> $null; pm2 delete wsac *> $null; Write-Host '=== PASO 5: npm install'; npm install --omit=dev; if ($LASTEXITCODE -ne 0) { Write-Host 'ERROR: npm install fallo'; exit 1 }; Write-Host '=== PASO 6: pm2 startOrReload (ecosystem.config.js, proceso WSAC-Backend)'; pm2 startOrReload ecosystem.config.js --update-env; pm2 save; Write-Host '=== PASO 7: health check'; $ok = $false; for ($i = 1; $i -le 6; $i++) { Start-Sleep -Seconds 5; try { $r = Invoke-WebRequest -Uri 'http://localhost:3005/health' -UseBasicParsing -TimeoutSec 10; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Write-Host ('Intento ' + $i + ' fallo, reintentando...') } }; if ($ok) { Write-Host '=== DEPLOY COMPLETADO ===' } else { Write-Host '=== ERROR: health check fallo tras el deploy. Ultimos logs de pm2: ==='; pm2 logs WSAC-Backend --lines 60 --nostream; exit 1 }"
